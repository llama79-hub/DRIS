server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — any path that isn't a
    # real file (e.g. /predict, /history) must still serve index.html
    # so the app's own router can take over, or a browser refresh on
    # those routes would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything the frontend calls at /api/* gets forwarded to the
    # backend container. The two containers talk to each other over
    # the Docker Compose network by service name ("backend") — that
    # hostname only resolves inside the Docker network, which is
    # exactly why the browser can't call it directly and needs this
    # proxy instead.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
